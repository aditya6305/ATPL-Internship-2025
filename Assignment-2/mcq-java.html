<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Test - Java</title>
</head>
<body>
    <h1>MCQ Test - Java (Page 1 of 3)</h1>
    
    <form action="mcq-html.html">
        <h2>Question 1: What is Java?</h2>
        <input type="radio" id="q1a" name="q1" value="a ">
        <label for="q1a">A programming language</label><br>
        <input type="radio" id="q1b" name="q1" value="b">
        <label for="q1b">A coffee brand</label><br>
        <input type="radio" id="q1c" name="q1" value="c">
        <label for="q1c">An island</label><br>
        <input type="radio" id="q1d" name="q1" value="d">
        <label for="q1d">A database</label><br>

        <h2>Question 2: Which company developed Java?</h2>
        <input type="radio" id="q2a" name="q2" value="a">
        <label for="q2a">Microsoft</label><br>
        <input type="radio" id="q2b" name="q2" value="b">
        <label for="q2b">Sun Microsystems</label><br>
        <input type="radio" id="q2c" name="q2" value="c">
        <label for="q2c">Google</label><br>
        <input type="radio" id="q2d" name="q2" value="d">
        <label for="q2d">Apple</label><br>

        <h2>Question 3: What is JVM?</h2>
        <input type="radio" id="q3a" name="q3" value="a">
        <label for="q3a">Java Virtual Machine</label><br>
        <input type="radio" id="q3b" name="q3" value="b">
        <label for="q3b">Java Variable Method</label><br>
        <input type="radio" id="q3c" name="q3" value="c">
        <label for="q3c">Java Version Manager</label><br>
        <input type="radio" id="q3d" name="q3" value="d">
        <label for="q3d">Java Visual Machine</label><br>

        <h2>Question 4: Which keyword is used to create a class in Java?</h2>
        <input type="radio" id="q4a" name="q4" value="a">
        <label for="q4a">class</label><br>
        <input type="radio" id="q4b" name="q4" value="b">
        <label for="q4b">Class</label><br>
        <input type="radio" id="q4c" name="q4" value="c">
        <label for="q4c">create</label><br>
        <input type="radio" id="q4d" name="q4" value="d">
        <label for="q4d">new</label><br>

        <h2>Question 5: What is the extension of Java source files?</h2>
        <input type="radio" id="q5a" name="q5" value="a">
        <label for="q5a">.java</label><br>
        <input type="radio" id="q5b" name="q5" value="b">
        <label for="q5b">.class</label><br>
        <input type="radio" id="q5c" name="q5" value="c">
        <label for="q5c">.jar</label><br>
        <input type="radio" id="q5d" name="q5" value="d">
        <label for="q5d">.exe</label><br>

        <br>
        <input type="submit" value="Next ->">
    </form>
</body>
</html>
