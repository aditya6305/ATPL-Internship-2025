<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Page - Image, Video, Audio</title>
</head>
<body>
    <h1>Media Elements Demo</h1>
    
    <h2>Image </h2>
    <img src="https://as1.ftcdn.net/v2/jpg/05/64/11/42/1000_F_564114238_mcU43Fplgq3J1wpxYUCvDIew9JxUbJrB.jpg" alt="Lord Krishna" width="400" height="400">

    <h2>Video </h2>
    <video width="400" height="300" controls>
        <source src="sample-360p.mp4" type="video/mp4">
        <source src="sample-360p.ogg" type="video/ogg">
        Your browser does not support the video tag.
    </video>
   
    
    <h2>Audio Example</h2>
    <audio controls>
        <source src="mp3_44100Hz_128kbps_stereo.mp3" type="audio/mpeg">
        <source src="mp3_44100Hz_128kbps_stereo.ogg" type="audio/ogg">
        
    </audio>
</body>
</html>
