<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .left-column {
            width: 30%;
            float: left;
            background-color: #e8f4fd;
            border: 2px solid #3498db;
            padding: 20px;
            box-sizing: border-box;
            margin-right: 2%;
        }
        
        .right-column {
            width: 68%;
            float: left;
            background-color: #fdf2e8;
            border: 2px solid #e67e22;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
        
        h2 {
            margin-top: 0;
            color: #333;
        }
        
        p {
            line-height: 1.6;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clearfix">
            <div class="left-column">
                <h3><b>Left column</b></h3>
                <h3>This is the side bar content</h3>
            </div>
            
            <div class="right-column">
                <h3><b>Right column</b></h3>
                <h3>This is the main article content area</h3>
            </div>
        </div>
    </div>
</body>
</html>
