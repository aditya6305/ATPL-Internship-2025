<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        .product-card {
            width: 300px;
            margin: 0 auto;
            background-color: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            background-color: #eee;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            display: block;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        
        .product-price {
            font-size: 20px;
            color: #e74c3c;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .buy-button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .buy-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <img src="https://img.freepik.com/free-vector/realistic-display-smartphone-with-different-apps_52683-30241.jpg?semt=ais_hybrid&w=740&q=80" alt="Product Image" class="product-image">
        <p class="product-name">Smartphone XYZ</p>
        <p class="product-price">12990</p>
        <button class="buy-button">Buy Now</button>
    </div>
</body>
</html>
