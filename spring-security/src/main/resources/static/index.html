<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" name="username" placeholder="Username" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <input type="password" name="confirm" placeholder="Confirm Password" required><br>
    <button type="submit">Register</button>
  </form>
  <p id="output"></p>

  <script>
    document.getElementById("registerForm").onsubmit = async (e) => {
      e.preventDefault();
      let username = e.target.username.value;
      let password = e.target.password.value;
      let confirm = e.target.confirm.value;

      if (password !== confirm) {
        document.getElementById("output").textContent = "Passwords do not match!";
        return; 
      }

      let response = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (response.ok) {
        document.getElementById("output").textContent = "Registered successfully! Redirecting...";
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1000);
      } else {
        document.getElementById("output").textContent = " Registration failed!";
      }
    };
  </script>
</body>
</html>
